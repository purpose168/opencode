<!doctype html>
<html lang="zh-CN" style="background-color: var(--background-base)">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCode</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#F8F7F7" />
    <meta name="theme-color" content="#131010" media="(prefers-color-scheme: dark)" />
    <meta property="og:image" content="/social-share.png" />
    <meta property="twitter:image" content="/social-share.png" />
    <!-- 主题预加载脚本 - 应用缓存的主题以避免 FOUC (Flash of Unstyled Content) -->
    <script id="oc-theme-preload-script">
      ;(function () {
        // 获取存储的主题 ID
        var themeId = localStorage.getItem("opencode-theme-id")
        // 如果没有主题 ID，则退出
        if (!themeId) return

        // 获取存储的颜色方案，默认为 "system"
        var scheme = localStorage.getItem("opencode-color-scheme") || "system"
        // 确定是否使用深色模式
        var isDark = scheme === "dark" || (scheme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        // 设置模式变量
        var mode = isDark ? "dark" : "light"

        // 将主题和颜色方案应用到文档根元素
        document.documentElement.dataset.theme = themeId
        document.documentElement.dataset.colorScheme = mode

        // 如果是默认主题 "oc-1"，则退出
        if (themeId === "oc-1") return

        // 获取存储的主题 CSS
        var css = localStorage.getItem("opencode-theme-css-" + themeId + "-" + mode)
        // 如果有存储的 CSS，则创建并添加样式元素
        if (css) {
          var style = document.createElement("style")
          style.id = "oc-theme-preload"
          style.textContent =
            ":root{color-scheme:" +
            mode +
            ";--text-mix-blend-mode:" +
            (isDark ? "plus-lighter" : "multiply") +
            ";" +
            css +
            "}"
          document.head.appendChild(style)
        }
      })()
    </script>
  </head>
  <body class="antialiased overscroll-none text-12-regular overflow-hidden">
    <noscript>您需要启用 JavaScript 来运行此应用。</noscript>
    <div id="root" class="flex flex-col h-screen"></div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
